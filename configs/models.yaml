# Models evaluated in this study, plus the Nature-paper models used as reference points.
# release: approximate public release month (YYYY-MM) - verify before quoting dates.
# gated: true -> accept the licence on the model's Hugging Face page with the same
#        account as your HF_TOKEN before running.

lineages:
  llama:   {label: Llama,   colour: "#2a78d6"}
  qwen:    {label: Qwen,    colour: "#eb6834"}
  mistral: {label: Mistral, colour: "#1baf7a"}

models:
  # ---- Llama --------------------------------------------------------------
  - name: llama-2-7b-chat
    hf_id: meta-llama/Llama-2-7b-chat-hf
    lineage: llama
    generation: 1
    release: "2023-07"
    gated: true
  - name: llama-3-8b-instruct
    hf_id: meta-llama/Meta-Llama-3-8B-Instruct
    lineage: llama
    generation: 2
    release: "2024-04"
    gated: true
  - name: llama-3.1-8b-instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    lineage: llama
    generation: 3
    release: "2024-07"
    gated: true

  # ---- Qwen ---------------------------------------------------------------
  - name: qwen1.5-7b-chat
    hf_id: Qwen/Qwen1.5-7B-Chat
    lineage: qwen
    generation: 1
    release: "2024-02"
  - name: qwen2.5-7b-instruct
    hf_id: Qwen/Qwen2.5-7B-Instruct
    lineage: qwen
    generation: 2
    release: "2024-09"
  - name: qwen3-8b
    hf_id: Qwen/Qwen3-8B
    lineage: qwen
    generation: 3
    release: "2025-04"
    chat_template_kwargs: {enable_thinking: false}

  # ---- Mistral ------------------------------------------------------------
  - name: mistral-7b-instruct-v0.1
    hf_id: mistralai/Mistral-7B-Instruct-v0.1
    lineage: mistral
    generation: 1
    release: "2023-09"
    gated: true
  - name: mistral-7b-instruct-v0.2
    hf_id: mistralai/Mistral-7B-Instruct-v0.2
    lineage: mistral
    generation: 2
    release: "2023-12"
    gated: true
  - name: mistral-7b-instruct-v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    lineage: mistral
    generation: 3
    release: "2024-05"
    gated: true

  # ---- Validation: also in the Nature paper (reference name llama3d2-3b) ---
  - name: llama-3.2-3b-instruct
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    lineage: validation
    generation: 0
    release: "2024-09"
    gated: true
    validates: llama3d2-3b

  # ---- Optional: chain-of-thought variant ---------------------------------
  - name: qwen3-8b-thinking
    hf_id: Qwen/Qwen3-8B
    lineage: optional
    generation: 0
    release: "2025-04"
    chat_template_kwargs: {enable_thinking: true}
    max_new_tokens: 4096
    optional: true

  # ---- Smoke test: tiny, CPU-friendly -------------------------------------
  - name: smoke-qwen2.5-0.5b
    hf_id: Qwen/Qwen2.5-0.5B-Instruct
    lineage: smoke
    generation: 0
    release: "2024-09"
    smoke: true

